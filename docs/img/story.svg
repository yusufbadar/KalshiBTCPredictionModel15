<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Timeline: March 2026 candle-pattern bot scrapped; 27 September lock-in rules frozen; 28 September to 10 October tested on unseen data; 10 October live with 100 dollars; 11 October first live day lost 10 dollars and the rules were tightened; 13 October two more losses traced to the market moving before the price feed, and the bot now waits when that happens."><title>Timeline: March 2026 candle-pattern bot scrapped; 27 September lock-in rules frozen; 28 September to 10 October tested on unseen data; 10 October live with 100 dollars; 11 October first live day lost 10 dollars and the rules were tightened; 13 October two more losses traced to the market moving before the price feed, and the bot now waits when that happens.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="398.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">THE STORY SO FAR</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Built, tested, shipped, corrected twice</text><line x1="124.0" y1="216.0" x2="1076.0" y2="216.0" stroke="#303030" stroke-width="3"/><circle cx="124.0" cy="216.0" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="3"/><text x="124.0" y="182.0" font-size="14" font-weight="700" fill="#9c9c9c" text-anchor="middle" letter-spacing="1.0" class="m">MAR 2026</text><text x="124.0" y="266.0" font-size="18.5" font-weight="700" fill="#ffffff" text-anchor="middle">Candle-pattern bot</text><text x="124.0" y="294.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">replayed on real fills:</text><text x="124.0" y="317.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">it loses. Scrapped.</text><circle cx="314.4" cy="216.0" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="3"/><text x="314.4" y="182.0" font-size="14" font-weight="700" fill="#9c9c9c" text-anchor="middle" letter-spacing="1.0" class="m">27 SEP</text><text x="314.4" y="266.0" font-size="18.5" font-weight="700" fill="#ffffff" text-anchor="middle">Lock-in rules, v1</text><text x="314.4" y="294.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">written down</text><text x="314.4" y="317.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">and frozen</text><circle cx="504.8" cy="216.0" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="3"/><text x="504.8" y="182.0" font-size="14" font-weight="700" fill="#9c9c9c" text-anchor="middle" letter-spacing="1.0" class="m">28 SEP TO 10 OCT</text><text x="504.8" y="266.0" font-size="18.5" font-weight="700" fill="#ffffff" text-anchor="middle">Unseen-data test</text><text x="504.8" y="294.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">two fresh weeks,</text><text x="504.8" y="317.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">still profitable</text><circle cx="695.2" cy="216.0" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="3"/><text x="695.2" y="182.0" font-size="14" font-weight="700" fill="#9c9c9c" text-anchor="middle" letter-spacing="1.0" class="m">10 OCT</text><text x="695.2" y="266.0" font-size="18.5" font-weight="700" fill="#ffffff" text-anchor="middle">Live with $100</text><text x="695.2" y="294.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">v2, on a small</text><text x="695.2" y="317.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">cloud server</text><circle cx="885.6" cy="216.0" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="3"/><text x="885.6" y="182.0" font-size="14" font-weight="700" fill="#9c9c9c" text-anchor="middle" letter-spacing="1.0" class="m">11 OCT</text><text x="885.6" y="266.0" font-size="18.5" font-weight="700" fill="#ffffff" text-anchor="middle">First day: −$10</text><text x="885.6" y="294.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">three early buys lost,</text><text x="885.6" y="317.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">v3 waits longer</text><circle cx="1076.0" cy="216.0" r="11" fill="#000000" stroke="#ffffff" stroke-width="3"/><circle cx="1076.0" cy="216.0" r="4.5" fill="#ffffff"/><text x="1076.0" y="182.0" font-size="14" font-weight="700" fill="#9c9c9c" text-anchor="middle" letter-spacing="1.0" class="m">13 OCT</text><text x="1076.0" y="266.0" font-size="18.5" font-weight="700" fill="#ffffff" text-anchor="middle">Market moved first</text><text x="1076.0" y="294.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">bought on stale news,</text><text x="1076.0" y="317.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="middle">v4 waits a second</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Deployment: the bot runs as a service on a small cloud server. The dashboard listens only inside the server and is reached from a laptop through an encrypted SSH tunnel."><title>Deployment: the bot runs as a service on a small cloud server. The dashboard listens only inside the server and is reached from a laptop through an encrypted SSH tunnel.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="438.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">ALWAYS ON</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Runs on a small cloud server, laptop closed</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">The dashboard never faces the internet. You reach it through an encrypted SSH tunnel.</text><rect x="48.0" y="180.0" width="250.0" height="190.0" rx="16" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="70.0" y="218.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">YOUR LAPTOP</text><text x="70.0" y="256.0" font-size="18.5" font-weight="700" fill="#ffffff">Browser</text><text x="70.0" y="284.0" font-size="18.5" font-weight="400" fill="#f4f4f4">localhost:8000</text><text x="70.0" y="312.0" font-size="18.5" font-weight="400" fill="#f4f4f4">open it when you like</text><rect x="458.0" y="180.0" width="400.0" height="190.0" rx="16" fill="#ffffff"/><text x="480.0" y="218.0" font-size="14.5" font-weight="700" fill="#444" letter-spacing="1.8" class="m">SERVER · UBUNTU</text><text x="480.0" y="256.0" font-size="18.5" font-weight="700" fill="#000">Lock-In, running as a service</text><text x="480.0" y="284.0" font-size="18.5" font-weight="400" fill="#333">dashboard: inside the server only</text><text x="480.0" y="312.0" font-size="18.5" font-weight="400" fill="#333">password, lockout after 5 tries</text><text x="480.0" y="340.0" font-size="18.5" font-weight="400" fill="#333">firewall: only SSH is open</text><rect x="968.0" y="180.0" width="184.0" height="190.0" rx="16" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="990.0" y="218.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">KALSHI</text><text x="990.0" y="256.0" font-size="18.5" font-weight="700" fill="#ffffff">Exchange</text><text x="990.0" y="284.0" font-size="18.5" font-weight="400" fill="#f4f4f4">prices in</text><text x="990.0" y="312.0" font-size="18.5" font-weight="400" fill="#f4f4f4">orders out</text><line x1="308.0" y1="268.0" x2="448.0" y2="268.0" stroke="#ffffff" stroke-width="2"/><line x1="308.0" y1="282.0" x2="448.0" y2="282.0" stroke="#ffffff" stroke-width="2"/><text x="378.0" y="253.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" class="m">SSH tunnel</text><text x="378.0" y="309.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="middle" class="m">encrypted</text><line x1="868.0" y1="268.0" x2="958.0" y2="268.0" stroke="#ffffff" stroke-width="2"/><line x1="868.0" y1="282.0" x2="958.0" y2="282.0" stroke="#ffffff" stroke-width="2"/><text x="913.0" y="309.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="middle" class="m">a few ms</text><text x="48.0" y="410.0" font-size="19" font-weight="400" fill="#9c9c9c">Reboot or crash: the service comes back and the bot resumes by itself. Stop means stop.</text></svg>

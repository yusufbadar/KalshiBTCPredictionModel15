<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Calibration: in every confidence band the favourite won at least as often as the model said, except the very top band where they match."><title>Calibration: in every confidence band the favourite won at least as often as the model said, except the very top band where they match.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="568.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">IS THE MODEL HONEST?</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">When it says 96%, it happens about 97% of the time</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">Every market in the backtest, final minute, grouped by how sure the model was about the favourite.</text><line x1="330.0" y1="178.0" x2="330.0" y2="486.0" stroke="#1f1f1f" stroke-width="1.5"/><text x="330.0" y="512.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="middle" class="m">60%</text><line x1="482.5" y1="178.0" x2="482.5" y2="486.0" stroke="#1f1f1f" stroke-width="1.5"/><text x="482.5" y="512.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="middle" class="m">70%</text><line x1="635.0" y1="178.0" x2="635.0" y2="486.0" stroke="#1f1f1f" stroke-width="1.5"/><text x="635.0" y="512.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="middle" class="m">80%</text><line x1="787.5" y1="178.0" x2="787.5" y2="486.0" stroke="#1f1f1f" stroke-width="1.5"/><text x="787.5" y="512.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="middle" class="m">90%</text><line x1="940.0" y1="178.0" x2="940.
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="A real losing trade on 13 October 2026. On Kalshi the price of YES fell from 98 cents to as low as 53 cents while the bot&#x27;s Bitcoin price still showed 9 to 12 dollars above the line. The bot bought at 81 cents. Just under a second later its price feed showed Bitcoin 14 dollars below the line."><title>A real losing trade on 13 October 2026. On Kalshi the price of YES fell from 98 cents to as low as 53 cents while the bot&#x27;s Bitcoin price still showed 9 to 12 dollars above the line. The bot bought at 81 cents. Just under a second later its price feed showed Bitcoin 14 dollars below the line.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="698.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">13 OCT 2026 · 1:44 PM ET · REAL MONEY</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">The market knew a second before the bot did</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">One losing trade, quarter second by quarter second. Kalshi&#x27;s traders moved first; the price feed followed.</text><text x="48.0" y="182.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="2.0">PRICE OF YES ON KALSHI</text><line x1="150.0" y1="204.0" x2="1128.0" y2="204.0" stroke="#1f1f1f" stroke-width="1.5"/><text x="136.0" y="210.0" font-size="16" font-weight="400" fill="#9c9c9c" text-anchor="end" class="m">100¢</text><line x1="150.0" y1="264.7" x2="1128.0" y2="264.7" stroke="#1f1f1f" stroke-width="1.5"/><text x="136.0" y="270.7" font-size="16" font-weight="400" fill="#9c9c9c" text-anchor="end" class="m">80¢</text><line x1="150.0" y1="325.3" x2="1128.0" y2="325.3" stroke="#1f1f1f" stroke-width="1.5"/><text x="136.0" y="331.3" font-size="16" font-weight="400" fill="#9c9c9c" text-anchor="end" class="m">60¢</text><line x1="150.0" y1="386.0" x2="1128.0" y2="386.0" stroke="#1f1f1f" stroke-width="1.5"/><text x="136.0" y="392.0" font-size="16" font-weight="400" fill="#9c9c9c" text-anchor="end" class="m">40¢</text><rect x="157.0" y="207.1" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="203.6" y="210.1" width="32.6" height="6.0" rx="3" fill="#ffffff"/><rect x="250.1" y="210.1" width="32.6" height="6.0" rx="3" fill="#ffffff"/><rect x="296.7" y="207.1" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="343.3" y="207.1" width="32.6" height="6.0" rx="3" fill="#ffffff"/><rect x="389.9" y="207.1" width="32.6" height="6.0" rx="3" fill="#ffffff"/><rect x="436.4" y="204.0" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="483.0" y="204.0" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="529.6" y="204.0" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="576.1" y="204.0" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="622.7" y="204.0" width="32.6" height="9.0" rx="3" fill="#ffffff"/><rect x="669.3" y="204.0" width="32.6" height="145.5" rx="3" fill="#ffffff"/><rect x="715.9" y="258.6" width="32.6" height="90.9" rx="3" fill="#ffffff"/><rect x="762.4" y="319.3" width="32.6" height="21.2" rx="3" fill="#ffffff"/><rect x="809.0" y="316.3" width="32.6" height="18.1" rx="3" fill="#ffffff"/><rect x="855.6" y="316.3" width="32.6" height="21.2" rx="3" fill="#ffffff"/><rect x="902.1" y="328.4" width="32.6" height="21.2" rx="3" fill="#ffffff"/><rect x="948.7" y="340.5" width="32.6" height="15.1" rx="3" fill="#ffffff"/><rect x="995.3" y="346.6" width="32.6" height="18.1" rx="3" fill="#ffffff"/><rect x="1041.9" y="349.6" width="32.6" height="15.1" rx="3" fill="#ffffff"/><rect x="1088.4" y="355.7" width="32.6" height="15.1" rx="3" fill="#ffffff"/><text x="48.0" y="452.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="2.0">BITCOIN AGAINST THE LINE, AS THE BOT&#x27;S PRICE FEED SHOWED IT</text><line x1="150.0" y1="525.1" x2="1128.0" y2="525.1" stroke="#9c9c9c" stroke-width="1.5" stroke-dasharray="5 6"/><text x="136.0" y="531.1" font-size="16" font-weight="400" fill="#9c9c9c" text-anchor="end">the line</text><path d="M150.0,492.3 L325.1,492.3 L325.1,491.4 L511.4,491.4 L511.4,489.0 L697.7,489.0 L697.7,498.9 L884.0,498.9 L884.0,567.4 L1070.3,567.4 L1070.3,565.9 L1128.0,565.9 " fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="159.3" y="479.1" font-size="17" font-weight="400" fill="#f4f4f4">$11 to $12 above: YES looks safe</text><text x="1128.0" y="553.5" font-size="17" font-weight="400" fill="#f4f4f4" text-anchor="end">$14 below</text><line x1="662.3" y1="202.0" x2="662.3" y2="590.0" stroke="#9c9c9c" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="708.9" y1="202.0" x2="708.9" y2="590.0" stroke="#ffffff" stroke-width="2"/><line x1="884.0" y1="202.0" x2="884.0" y2="590.0" stroke="#9c9c9c" stroke-width="1.5" stroke-dasharray="3 5"/><circle cx="708.9" cy="261.6" r="8" fill="#000000" stroke="#ffffff" stroke-width="3"/><text x="650.3" y="355.7" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="end">27,703 contracts</text><text x="650.3" y="376.7" font-size="16.5" font-weight="400" fill="#9c9c9c" text-anchor="end">sold in a quarter second</text><text x="770.9" y="234.3" font-size="17" font-weight="700" fill="#ffffff">the bot buys YES at 81¢</text><text x="770.9" y="256.3" font-size="16.5" font-weight="400" fill="#9c9c9c">its model still says 96% sure</text><path d="M662.3,409 V416 H884.0 V409" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="773.1" y="440.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" class="m">about one second</text><text x="896.0" y="484.0" font-size="16.5" font-weight="400" fill="#9c9c9c">the price feed catches up</text><rect x="48.0" y="626.0" width="1104.0" height="50.0" rx="14" fill="#ffffff"/><text x="600.0" y="658.0" font-size="20" font-weight="700" fill="#000" text-anchor="middle">Now it waits: after a drop of more than 10¢ or a rush of selling, it looks again a second later.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 728" width="1200" height="728" role="img" aria-label="Six checks before every order: final 55 seconds, model at least 90 percent sure, price safely clear of the line, still at least one cent cheaper than fair value after fees, the market has not just moved against it, inside the risk limits."><title>Six checks before every order: final 55 seconds, model at least 90 percent sure, price safely clear of the line, still at least one cent cheaper than fair value after fees, the market has not just moved against it, inside the risk limits.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="726.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">THE RULE</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Six questions before any order</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">It buys only when every answer is yes. Most markets end without a trade.</text><rect x="48.0" y="176.0" width="1104.0" height="66.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="74.0" y="217.0" font-size="20" font-weight="700" fill="#9c9c9c" class="m">1</text><circle cx="128.0" cy="209.0" r="15" fill="none" stroke="#ffffff" stroke-width="2.2"/><path d="M128,200 V209 L135,213" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="172.0" y="205.0" font-size="22" font-weight="700" fill="#ffffff">Is it the final minute?</text><text x="172.0" y="229.0" font-size="18" font-weight="400" fill="#9c9c9c">Only the last 55 seconds count. Earlier is guessing.</text><rect x="933.4" y="191.0" width="196.6" height="34.0" rx="17.0" fill="none" stroke="#303030" stroke-width="1.5"/><text x="1031.7" y="213.8" font-size="16" font-weight="700" fill="#f4f4f4" text-anchor="middle" letter-spacing="0.6" class="m">55 s or less left</text><rect x="48.0" y="254.0" width="1104.0" height="66.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="74.0" y="295.0" font-size="20" font-weight="700" fill="#9c9c9c" class="m">2</text><circle cx="128.0" cy="287.0" r="15" fill="none" stroke="#ffffff" stroke-width="2.2"/><circle cx="128.0" cy="287.0" r="8" fill="none" stroke="#ffffff" stroke-width="2.2"/><circle cx="128.0" cy="287.0" r="2.5" fill="#ffffff"/><text x="172.0" y="283.0" font-size="22" font-weight="700" fill="#ffffff">Is one side a strong favourite?</text><text x="172.0" y="307.0" font-size="18" font-weight="400" fill="#9c9c9c">The model must rate it at least 90% likely to win.</text><rect x="992.9" y="269.0" width="137.1" height="34.0" rx="17.0" fill="none" stroke="#303030" stroke-width="1.5"/><text x="1061.4" y="291.8" font-size="16" font-weight="700" fill="#f4f4f4" text-anchor="middle" letter-spacing="0.6" class="m">model ≥ 90%</text><rect x="48.0" y="332.0" width="1104.0" height="66.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="74.0" y="373.0" font-size="20" font-weight="700" fill="#9c9c9c" class="m">3</text><line x1="113.0" y1="352.0" x2="143.0" y2="352.0" stroke="#ffffff" stroke-width="2.2"/><line x1="113.0" y1="378.0" x2="143.0" y2="378.0" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="4 4"/><path d="M128,358 V372 M124,362 L128,357 L132,362 M124,368 L128,373 L132,368" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="172.0" y="361.0" font-size="22" font-weight="700" fill="#ffffff">Is the price safely clear of the line?</text><text x="172.0" y="385.0" font-size="18" font-weight="400" fill="#9c9c9c">Far enough that a normal wobble will not flip it.</text><rect x="903.6" y="347.0" width="226.4" height="34.0" rx="17.0" fill="none" stroke="#303030" stroke-width="1.5"/><text x="1016.8" y="369.8" font-size="16" font-weight="700" fill="#f4f4f4" text-anchor="middle" letter-spacing="0.6" class="m">≥ 1.5 σ, ≥ $17 early</text><rect x="48.0" y="410.0" width="1104.0" height="66.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="74.0" y="451.0" font-size="20" font-weight="700" fill="#9c9c9c" class="m">4</text><path d="M113,432 H130 L143,443 L130,454 H113 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120.0" cy="443.0" r="2.6" fill="#ffffff"/><text x="172.0" y="439.0" font-size="22" font-weight="700" fill="#ffffff">Is it still on sale?</text><text x="172.0" y="463.0" font-size="18" font-weight="400" fill="#9c9c9c">At least 1¢ cheaper than it is worth, after Kalshi&#x27;s fee.</text><rect x="1012.7" y="425.0" width="117.3" height="34.0" rx="17.0" fill="none" stroke="#303030" stroke-width="1.5"/><text x="1071.4" y="447.8" font-size="16" font-weight="700" fill="#f4f4f4" text-anchor="middle" letter-spacing="0.6" class="m">edge ≥ 1¢</text><rect x="48.0" y="488.0" width="1104.0" height="66.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="74.0" y="529.0" font-size="20" font-weight="700" fill="#9c9c9c" class="m">5</text><path d="M111,521 H120 L125,508 L132,534 L136,521 H145" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="172.0" y="517.0" font-size="22" font-weight="700" fill="#ffffff">Is the market calm right now?</text><text x="172.0" y="541.0" font-size="18" font-weight="400" fill="#9c9c9c">If its price just dropped or sellers just rushed in, it waits a second.</text><rect x="963.1" y="503.0" width="166.9" height="34.0" rx="17.0" fill="none" stroke="#303030" stroke-width="1.5"/><text x="1046.6" y="525.8" font-size="16" font-weight="700" fill="#f4f4f4" text-anchor="middle" letter-spacing="0.6" class="m">no sudden drop</text><rect x="48.0" y="566.0" width="1104.0" height="66.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="74.0" y="607.0" font-size="20" font-weight="700" fill="#9c9c9c" class="m">6</text><path d="M128,583 L141,588 V597 C141,606 135,611 128,615 C121,611 115,606 115,597 V588 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="172.0" y="595.0" font-size="22" font-weight="700" fill="#ffffff">Is the bet small enough?</text><text x="172.0" y="619.0" font-size="18" font-weight="400" fill="#9c9c9c">Inside every risk limit, with fresh prices on screen.</text><rect x="953.2" y="581.0" width="176.8" height="34.0" rx="17.0" fill="none" stroke="#303030" stroke-width="1.5"/><text x="1041.6" y="603.8" font-size="16" font-weight="700" fill="#f4f4f4" text-anchor="middle" letter-spacing="0.6" class="m">≤ 6% of account</text><rect x="48.0" y="648.0" width="1104.0" height="50.0" rx="14" fill="#ffffff"/><text x="600.0" y="680.0" font-size="20" font-weight="700" fill="#000" text-anchor="middle">Six yes answers → buy at once, hold under a minute, collect $1 per contract if right.</text></svg>

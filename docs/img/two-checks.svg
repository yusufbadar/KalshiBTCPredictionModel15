<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The live code replayed trade by trade over 82 days. Without the two checks: 1,920 trades, 4.1 percent lost, profit 629 dollars, worst dip 34 dollars. With them: 1,720 trades, 2.8 percent lost, profit 733 dollars, worst dip 24 dollars."><title>The live code replayed trade by trade over 82 days. Without the two checks: 1,920 trades, 4.1 percent lost, profit 629 dollars, worst dip 34 dollars. With them: 1,720 trades, 2.8 percent lost, profit 733 dollars, worst dip 24 dollars.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="468.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">WHAT WAITING IS WORTH</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Fewer bad buys, 90% of the trades kept</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">The live code replayed trade by trade over 82 days of real markets. $100 account, at most 10% per trade.</text><text x="470.0" y="196.0" font-size="14.5" font-weight="700" fill="#9c9c9c" text-anchor="end" letter-spacing="1.6" class="m">TRADES</text><text x="620.0" y="196.0" font-size="14.5" font-weight="700" fill="#9c9c9c" text-anchor="end" letter-spacing="1.6" class="m">LOST</text><text x="800.0" y="196.0" font-size="14.5" font-weight="700" fill="#9c9c9c" text-anchor="end" letter-spacing="1.6" class="m">PROFIT</text><text x="975.0" y="196.0" font-size="14.5" font-weight="700" fill="#9c9c9c" text-anchor="end" letter-spacing="1.6" class="m">WORST DIP</text><text x="1128.0" y="196.0" font-size="14.5" font-weight="700" fill="#9c9c9c" text-anchor="end" letter-spacing="1.6" class="m">WORST DAY</text><rect x="48.0" y="214.0" width="1104.0" height="78.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="72.0" y="261.0" font-size="22" font-weight="700" fill="#ffffff">Without the two checks</text><text x="470.0" y="263.0" font-size="27" font-weight="700" fill="#ffffff" text-anchor="end" class="m">1,920</text><text x="620.0" y="263.0" font-size="27" font-weight="700" fill="#ffffff" text-anchor="end" class="m">4.1%</text><text x="800.0" y="263.0" font-size="27" font-weight="700" fill="#ffffff" text-anchor="end" class="m">+$629</text><text x="975.0" y="263.0" font-size="27" font-weight="700" fill="#ffffff" text-anchor="end" class="m">$34</text><text x="1128.0" y="263.0" font-size="27" font-weight="700" fill="#ffffff" text-anchor="end" class="m">−$26</text><rect x="48.0" y="306.0" width="1104.0" height="78.0" rx="14" fill="#ffffff"/><text x="72.0" y="353.0" font-size="22" font-weight="700" fill="#000">With the two checks</text><text x="470.0" y="355.0" font-size="27" font-weight="700" fill="#000" text-anchor="end" class="m">1,720</text><text x="620.0" y="355.0" font-size="27" font-weight="700" fill="#000" text-anchor="end" class="m">2.8%</text><text x="800.0" y="355.0" font-size="27" font-weight="700" fill="#000" text-anchor="end" class="m">+$733</text><text x="975.0" y="355.0" font-size="27" font-weight="700" fill="#000" text-anchor="end" class="m">$24</text><text x="1128.0" y="355.0" font-size="27" font-weight="700" fill="#000" text-anchor="end" class="m">−$15</text><text x="48.0" y="432.0" font-size="19" font-weight="400" fill="#9c9c9c">Losing days: 17 of 82 without, 12 of 82 with. A replay is not a promise: live trading is the real test.</text></svg>

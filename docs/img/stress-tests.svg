<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Stress tests of the backtest: profit stays positive with slower reactions, smaller orders, less liquidity, worse fills and a more cautious model."><title>Stress tests of the backtest: profit stays positive with slower reactions, smaller orders, less liquidity, worse fills and a more cautious model.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="518.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">STRESS TESTS</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Still positive when conditions get worse</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">The same replay with one thing made harder each time. Current rule, whole period, test size.</text><text x="48.0" y="208.0" font-size="19.5" font-weight="700" fill="#ffffff">As tested</text><rect x="470.0" y="188.0" width="540.0" height="28.0" rx="4" fill="#ffffff"/><text x="1024.0" y="209.0" font-size="19.5" font-weight="700" fill="#ffffff" class="m">+$6,149</text><text x="48.0" y="254.0" font-size="19.5" font-weight="400" fill="#f4f4f4">Bot reacts four times slower (1 s)</text><rect x="470.0" y="234.0" width="535.0" height="28.0" rx="4" fill="#ffffff" opacity="0.55"/><text x="1019.0" y="255.0" font-size="19.5" font-weight="700" fill="#ffffff" class="m">+$6,092</text><text x="48.0" y="300.0" font-size="19.5" font-weight="400" fill="#f4f4f4">Smaller orders (20 contracts max)</text><rect x="470.0" y="280.0" width="430.5" height="28.0" rx="4" fill="#ffffff" opacity="0.55"/><text x="914.5" y="301.0" font-size="19.5" font-weight="700" fill="#ffffff" class="m">+$4,902</text><text x="48.0" y="346.0" font-size="19.5" font-weight="400" fill="#f4f4f4">Half as much available to buy</text><rect x="470.0" y="326.0" width="360.6" height="28.0" rx="4" fill="#ffffff" opacity="0.55"/><text x="844.6" y="347.0" font-size="19.5" font-weight="700" fill="#ffffff" class="m">+$4,106</text><text x="48.0" y="392.0" font-size="19.5" font-weight="400" fill="#f4f4f4">Every fill 2¢ worse</text><rect x="470.0" y="372.0" width="301.9" height="28.0" rx="4" fill="#ffffff" opacity="0.55"/><text x="785.9" y="393.0" font-size="19.5" font-weight="700" fill="#ffffff" class="m">+$3,438</text><text x="48.0" y="438.0" font-size="19.5" font-weight="400" fill="#f4f4f4">Model made 50% more cautious</text><rect x="470.0" y="418.0" width="255.0" height="28.0" rx="4" fill="#ffffff" opacity="0.55"/><text x="739.0" y="439.0" font-size="19.5" font-weight="700" fill="#ffffff" class="m">+$2,903</text><text x="48.0" y="488.0" font-size="19" font-weight="400" fill="#9c9c9c">A replay cannot capture everything. Live trading is the real test.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="A win earns about 6.6 cents per contract and a loss costs about 93.4 cents, so the bot must be right more than 93.4% of the time. Backtest: 96.8%. First live day: 87.5%."><title>A win earns about 6.6 cents per contract and a loss costs about 93.4 cents, so the bot must be right more than 93.4% of the time. Backtest: 96.8%. First live day: 87.5%.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#000"/><rect width="3" height="7" fill="#c8c8c8"/></pattern></defs><rect x="1.0" y="1.0" width="1198.0" height="478.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">THE CATCH</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Small wins, big losses</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">It buys near-certain things, so each win is small and each miss costs nearly the whole stake.</text><text x="48.0" y="200.0" font-size="21" font-weight="700" fill="#ffffff">One contract at the average price paid, 93¢</text><text x="48.0" y="252.0" font-size="19" font-weight="400" fill="#9c9c9c">if right</text><rect x="140.0" y="232.0" width="26.2" height="30.0" rx="3" fill="#ffffff"/><text x="180.2" y="255.0" font-size="21" font-weight="700" fill="#ffffff" class="m">+6.6¢</text><text x="48.0" y="312.0" font-size="19" font-weight="400" fill="#9c9c9c">if wrong</text><rect x="140.0" y="292.0" width="373.8" height="30.0" rx="3" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.5"/><text x="527.8" y="315.0" font-size="21" font-weight="700" fill="#ffffff" class="m">−93.4¢</text><text x="48.0" y="370.0" font-size="21" font-weight="400" fill="#f4f4f4">One loss wipes out about 14 wins.</text><text x="700.0" y="200.0" font-size="21" font-weight="700" fill="#ffffff">So it has to be right this often</text><rect x="706.0" y="287.0" width="247.6" height="26.0" rx="4" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.5"/><rect x="953.6" y="287.0" width="192.4" height="26.0" rx="4" fill="#ffffff" opacity="0.9"/><text x="706.0" y="272.0" font-size="15" font-weight="400" fill="#9c9c9c" class="m">85%</text><text x="1146.0" y="272.0" font-size="15" font-weight="400" fill="#9c9c9c" text-anchor="end" class="m">100%</text><line x1="953.6" y1="256.0" x2="953.6" y2="322.0" stroke="#ffffff" stroke-width="2.5"/><text x="953.6" y="246.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" class="m">break-even 93.4%</text><circle cx="1053.0" cy="300.0" r="8" fill="#000" stroke="#ffffff" stroke-width="3"/><line x1="1053.0" y1="312.0" x2="1053.0" y2="334.0" stroke="#9c9c9c" stroke-width="1.5"/><text x="1053.0" y="356.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" class="m">backtest 96.8%</text><circle cx="779.3" cy="300.0" r="8" fill="#ffffff" stroke="#000" stroke-width="3"/><line x1="779.3" y1="312.0" x2="779.3" y2="334.0" stroke="#9c9c9c" stroke-width="1.5"/><text x="779.3" y="356.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" class="m">first live day 87.5%</text><text x="829.8" y="392.0" font-size="17" font-weight="400" fill="#9c9c9c" text-anchor="middle">loses money</text><text x="1049.8" y="392.0" font-size="17" font-weight="400" fill="#9c9c9c" text-anchor="middle">makes money</text><text x="48.0" y="440.0" font-size="21" font-weight="400" fill="#f4f4f4">A few points of win rate decide everything. That is why the rules are strict and the bets are small.</text></svg>

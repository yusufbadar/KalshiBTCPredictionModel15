<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="How the bot is built: prices come in from Kalshi, a model works out the odds, six checks decide whether to buy, risk limits size the order, and the order goes back to Kalshi. Every step is recorded in a trade log and shown on the dashboard."><title>How the bot is built: prices come in from Kalshi, a model works out the odds, six checks decide whether to buy, risk limits size the order, and the order goes back to Kalshi. Every step is recorded in a trade log and shown on the dashboard.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="478.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">UNDER THE HOOD</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">From a price to an order</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">The same rule runs in the research replay and in the live bot, and a test fails if they disagree.</text><rect x="48.0" y="172.0" width="1104.0" height="46.0" rx="12" fill="none" stroke="#ffffff" stroke-width="2"/><text x="600.0" y="202.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3" class="m">KALSHI EXCHANGE</text><rect x="48.0" y="268.0" width="198.4" height="96.0" rx="14" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="66.0" y="300.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">PRICE FEED</text><text x="66.0" y="328.0" font-size="18" font-weight="600" fill="#ffffff">Bitcoin&#x27;s price,</text><text x="66.0" y="350.0" font-size="18" font-weight="600" fill="#ffffff">every Kalshi trade</text><line x1="250.4" y1="316.0" x2="271.4" y2="316.0" stroke="#ffffff" stroke-width="2"/><path d="M271.4,316.0 L262.4,310.0 L262.4,322.0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="147.2" y1="364.0" x2="147.2" y2="410.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 6"/><rect x="274.4" y="268.0" width="198.4" height="96.0" rx="14" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="292.4" y="300.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">MODEL</text><text x="292.4" y="328.0" font-size="18" font-weight="600" fill="#ffffff">the odds that</text><text x="292.4" y="350.0" font-size="18" font-weight="600" fill="#ffffff">each side wins</text><line x1="476.8" y1="316.0" x2="497.8" y2="316.0" stroke="#ffffff" stroke-width="2"/><path d="M497.79999999999995,316.0 L488.79999999999995,310.0 L488.79999999999995,322.0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="373.6" y1="364.0" x2="373.6" y2="410.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 6"/><rect x="500.8" y="268.0" width="198.4" height="96.0" rx="14" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="518.8" y="300.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">SIX CHECKS</text><text x="518.8" y="328.0" font-size="18" font-weight="600" fill="#ffffff">buy only if</text><text x="518.8" y="350.0" font-size="18" font-weight="600" fill="#ffffff">all six pass</text><line x1="703.2" y1="316.0" x2="724.2" y2="316.0" stroke="#ffffff" stroke-width="2"/><path d="M724.2,316.0 L715.2,310.0 L715.2,322.0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="600.0" y1="364.0" x2="600.0" y2="410.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 6"/><rect x="727.2" y="268.0" width="198.4" height="96.0" rx="14" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="745.2" y="300.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">RISK LIMITS</text><text x="745.2" y="328.0" font-size="18" font-weight="600" fill="#ffffff">size the order</text><text x="745.2" y="350.0" font-size="18" font-weight="600" fill="#ffffff">to the account</text><line x1="929.6" y1="316.0" x2="950.6" y2="316.0" stroke="#ffffff" stroke-width="2"/><path d="M950.6,316.0 L941.6,310.0 L941.6,322.0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="826.4" y1="364.0" x2="826.4" y2="410.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 6"/><rect x="953.6" y="268.0" width="198.4" height="96.0" rx="14" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="971.6" y="300.0" font-size="14.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.8" class="m">ORDER</text><text x="971.6" y="328.0" font-size="18" font-weight="600" fill="#ffffff">buy now</text><text x="971.6" y="350.0" font-size="18" font-weight="600" fill="#ffffff">or cancel</text><line x1="1052.8" y1="364.0" x2="1052.8" y2="410.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 6"/><line x1="147.2" y1="218.0" x2="147.2" y2="265.0" stroke="#ffffff" stroke-width="2"/><path d="M147.2,265 L141.2,256 L153.2,256 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="161.2" y="249.0" font-size="15.5" font-weight="400" fill="#9c9c9c" class="m">prices</text><line x1="1052.8" y1="268.0" x2="1052.8" y2="221.0" stroke="#ffffff" stroke-width="2"/><path d="M1052.8,221 L1058.8,230 L1046.8,230 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="1038.8" y="249.0" font-size="15.5" font-weight="400" fill="#9c9c9c" text-anchor="end" class="m">orders</text><rect x="48.0" y="410.0" width="1104.0" height="46.0" rx="12" fill="#ffffff"/><text x="600.0" y="440.0" font-size="16" font-weight="700" fill="#000" text-anchor="middle" letter-spacing="0.8" class="m">TRADE LOG + DASHBOARD: every step is recorded and shown live</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="A Kalshi market is a yes-or-no question. Each side costs between 1 and 99 cents and the winning side pays one dollar."><title>A Kalshi market is a yes-or-no question. Each side costs between 1 and 99 cents and the winning side pays one dollar.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="418.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">THE MARKET</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Every 15 minutes, one yes-or-no question</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">You can buy YES or NO. The side that turns out right pays $1.00. The other pays nothing.</text><rect x="48.0" y="176.0" width="548.0" height="204.0" rx="18" fill="#0c0c0c" stroke="#303030" stroke-width="1.5"/><text x="74.0" y="216.0" font-size="14" font-weight="700" fill="#9c9c9c" letter-spacing="1.6" class="m">KALSHI · BITCOIN · 15 MINUTES</text><text x="74.0" y="258.0" font-size="27" font-weight="600" fill="#ffffff">Will Bitcoin be above</text><text x="74.0" y="294.0" font-size="27" font-weight="600" fill="#ffffff">$83,581.29 at 3:15 PM?</text><rect x="74.0" y="318.0" width="240.0" height="44.0" rx="11" fill="#ffffff"/><text x="194.0" y="347.0" font-size="20" font-weight="700" fill="#000" text-anchor="middle" class="m">YES   94¢</text><rect x="330.0" y="318.0" width="240.0" height="44.0" rx="11" fill="none" stroke="#9c9c9c" stroke-width="1.5"/><text x="450.0" y="347.0" font-size="20" font-weight="700" fill="#f4f4f4" text-anchor="middle" class="m">NO   7¢</text><rect x="640.0" y="176.0" width="512.0" height="62.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="664.0" y="215.0" font-size="20" font-weight="400" fill="#f4f4f4">If it finishes above</text><text x="1128.0" y="215.0" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end" class="m">YES pays $1.00</text><rect x="640.0" y="252.0" width="512.0" height="62.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="664.0" y="291.0" font-size="20" font-weight="400" fill="#f4f4f4">If it finishes below</text><text x="1128.0" y="291.0" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end" class="m">NO pays $1.00</text><text x="642.0" y="354.0" font-size="19" font-weight="400" fill="#9c9c9c">The price is the crowd&#x27;s odds:</text><text x="642.0" y="380.0" font-size="19" font-weight="600" fill="#f4f4f4">94¢ means about a 94% chance.</text></svg>

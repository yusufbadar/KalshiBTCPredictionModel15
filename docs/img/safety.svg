<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Built-in limits for a 100 dollar account: at most 6 dollars in one contract, 10 dollars on one closing moment, trading stops for the day after losing 15 dollars, and the bot switches itself off after a 30 percent fall from the peak."><title>Built-in limits for a 100 dollar account: at most 6 dollars in one contract, 10 dollars on one closing moment, trading stops for the day after losing 15 dollars, and the bot switches itself off after a 30 percent fall from the peak.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1.0" y="1.0" width="1198.0" height="518.0" rx="24" fill="#000000" stroke="#303030" stroke-width="2"/><text x="48.0" y="60.0" font-size="16" font-weight="700" fill="#9c9c9c" letter-spacing="2.6">SAFETY RAILS</text><text x="48.0" y="106.0" font-size="34" font-weight="700" fill="#ffffff">Limits it cannot argue with</text><text x="48.0" y="142.0" font-size="21" font-weight="400" fill="#9c9c9c">Shown for a $100 account. Each limit is a share of the balance, so it scales as the account changes.</text><rect x="48.0" y="174.0" width="264.0" height="160.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="70.0" y="228.0" font-size="42" font-weight="700" fill="#ffffff" class="m">$6</text><text x="70.0" y="260.0" font-size="18" font-weight="400" fill="#f4f4f4">the most it puts into</text><text x="70.0" y="283.0" font-size="18" font-weight="400" fill="#f4f4f4">one contract</text><text x="70.0" y="314.0" font-size="13.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.4" class="m">6% OF ACCOUNT</text><rect x="328.0" y="174.0" width="264.0" height="160.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="350.0" y="228.0" font-size="42" font-weight="700" fill="#ffffff" class="m">$10</text><text x="350.0" y="260.0" font-size="18" font-weight="400" fill="#f4f4f4">the most riding on</text><text x="350.0" y="283.0" font-size="18" font-weight="400" fill="#f4f4f4">one closing moment</text><text x="350.0" y="314.0" font-size="13.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.4" class="m">10% OF ACCOUNT</text><rect x="608.0" y="174.0" width="264.0" height="160.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="630.0" y="228.0" font-size="42" font-weight="700" fill="#ffffff" class="m">−$15</text><text x="630.0" y="260.0" font-size="18" font-weight="400" fill="#f4f4f4">a day&#x27;s loss that stops</text><text x="630.0" y="283.0" font-size="18" font-weight="400" fill="#f4f4f4">it until tomorrow</text><text x="630.0" y="314.0" font-size="13.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.4" class="m">15% OF ACCOUNT</text><rect x="888.0" y="174.0" width="264.0" height="160.0" rx="14" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="1.5"/><text x="910.0" y="228.0" font-size="42" font-weight="700" fill="#ffffff" class="m">−30%</text><text x="910.0" y="260.0" font-size="18" font-weight="400" fill="#f4f4f4">a fall from the peak</text><text x="910.0" y="283.0" font-size="18" font-weight="400" fill="#f4f4f4">that switches it off</text><text x="910.0" y="314.0" font-size="13.5" font-weight="700" fill="#9c9c9c" letter-spacing="1.4" class="m">KILL SWITCH</text><path d="M51.0,378.0 l6.3,6.8 l11.7,-13.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="88.0" y="384.0" font-size="18.5" font-weight="400" fill="#f4f4f4">Demo by default; live stays locked until you unlock it</text><path d="M615.0,378.0 l6.3,6.8 l11.7,-13.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="652.0" y="384.0" font-size="18.5" font-weight="400" fill="#f4f4f4">Orders sized to the cash actually free, fees included</text><path d="M51.0,418.0 l6.3,6.8 l11.7,-13.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="88.0" y="424.0" font-size="18.5" font-weight="400" fill="#f4f4f4">No trade on a stale price feed or order book</text><path d="M615.0,418.0 l6.3,6.8 l11.7,-13.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="652.0" y="424.0" font-size="18.5" font-weight="400" fill="#f4f4f4">One bot per account; a second copy refuses to start</text><path d="M51.0,458.0 l6.3,6.8 l11.7,-13.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="88.0" y="464.0" font-size="18.5" font-weight="400" fill="#f4f4f4">Kill switch is remembered across restarts</text><path d="M615.0,458.0 l6.3,6.8 l11.7,-13.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="652.0" y="464.0" font-size="18.5" font-weight="400" fill="#f4f4f4">Dashboard: password, lockout, local machine only</text></svg>

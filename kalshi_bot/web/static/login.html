<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Lock-In</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#000;--panel:#0a0a0a;--panel2:#111;--line:#1d1d1d;--line2:#2a2a2a;--text:#f4f4f4;--muted:#8b8b8b;--invert:#000;--hi:#fff;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
[data-theme=light]{--bg:#fff;--panel:#fcfcfc;--panel2:#f4f4f4;--line:#e8e8e8;--line2:#d6d6d6;--text:#0b0b0b;--muted:#6e6e6e;--invert:#fff;--hi:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;margin-bottom:22px}
.logo{width:26px;height:26px;border:2px solid var(--hi);border-radius:7px;display:grid;place-items:center;font:700 11px var(--mono)}
label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
input{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:11px 12px;font:14px var(--mono)}
input:focus{outline:none;border-color:var(--hi)}
button{width:100%;margin-top:14px;font:600 14px var(--sans);border-radius:10px;border:1px solid var(--hi);background:var(--hi);color:var(--invert);padding:11px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{min-height:20px;margin-top:12px;font-size:13px;font-weight:600}
.note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="brand"><div class="logo">15</div>LOCK-IN</div>
  <label for="pw">Dashboard password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Sign in</button>
  <div class="msg" id="msg" role="alert"></div>
  <div class="note">This dashboard controls a trading bot. Sessions end after 12 hours.</div>
</form>
<script>
document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pw.value})});
    if (r.ok) { location.replace('/'); return; }
    let j = {}; try { j = await r.json(); } catch (err) {}
    msg.textContent = j.detail || 'Could not sign in.';
    pw.value = ''; pw.focus();
  } catch (err) {
    msg.textContent = 'Cannot reach the bot. Is it running?';
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
